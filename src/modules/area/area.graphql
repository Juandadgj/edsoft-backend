type Area {
  id_area: Int!
  name: String
  status: String
}

input CreateAreaInput {
  name: String!
  status: String
}

input UpdateAreaInput {
  id_area: Int!
  name: String
  status: String
}

input FilterAreaInput {
  name: String
  status: String
}

type Query {
  areas(filterAreaInput: FilterAreaInput): [Area]!
}

type Mutation {
  createArea(createAreaInput: CreateAreaInput!): Area!
  updateArea(updateAreaInput: UpdateAreaInput!): Area!
  deleteArea(id_area: Int!): Area!
}
