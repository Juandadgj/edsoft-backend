type Featured {
  id_featured: Int!
  id_group: Int
  id_student: Int
}

input CreateFeaturedInput {
  id_group: Int
  id_student: Int
}

input FilterFeaturedInput {
  id_group: Int
  id_student: Int
}

type Query {
  featured(filterFeaturedInput: FilterFeaturedInput): [Featured]!
}

type Mutation {
  createFeatured(createFeaturedInput: CreateFeaturedInput!): Featured!
  deleteFeatured(id_featured: Int!): Featured
}
